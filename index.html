<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Página de Andrea Mateos Perdigones</title>
    
    <!-- Fuente 'Poppins' de Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
    
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            /* Fondo rosa clarito suave en degradado */
            background: linear-gradient(135deg, #fce7f3 0%, #fbcfe8 50%, #f472b6 100%);
            font-family: 'Poppins', system-ui, sans-serif;
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow: hidden;
            position: relative;
        }

        /* Adornos decorativos flotantes de fondo */
        .burbuja {
            position: absolute;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.35);
            backdrop-filter: blur(4px);
            pointer-events: none;
        }

        .burbuja-1 { width: 140px; height: 140px; top: 8%; left: 8%; }
        .burbuja-2 { width: 220px; height: 220px; bottom: 8%; right: 6%; }
        .burbuja-3 { width: 90px; height: 90px; bottom: 22%; left: 12%; }

        /* Iconos decorativos con animación suave */
        .destello {
            position: absolute;
            font-size: 1.8rem;
            pointer-events: none;
            animation: brillar 3s infinite ease-in-out alternate;
        }

        .destello-1 { top: 15%; right: 18%; animation-delay: 0s; }
        .destello-2 { bottom: 25%; left: 20%; animation-delay: 1.5s; }
        .destello-3 { top: 28%; left: 16%; animation-delay: 0.8s; }

        @keyframes brillar {
            0% { transform: scale(0.8) rotate(-5deg); opacity: 0.6; }
            100% { transform: scale(1.2) rotate(10deg); opacity: 1; }
        }

        /* Tarjeta principal con fondo rosa translúcido para garantizar contraste */
        .tarjeta {
            background: rgba(219, 39, 119, 0.45); 
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            padding: 3rem 2.5rem;
            border-radius: 24px;
            box-shadow: 0 15px 35px rgba(190, 24, 93, 0.2);
            max-width: 480px;
            text-align: center;
            border: 2px solid rgba(255, 255, 255, 0.5);
            position: relative;
            z-index: 10;
        }
