<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Página de Andrea Mateos Perdigones</title>
    
    <!-- Fuente 'Poppins' de Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
    
    <style>
        body {
            background-color: #ec4899; /* Fondo rosa principal */
            font-family: 'Poppins', system-ui, sans-serif; 
            color: #ffffff; /* Letras blancas */
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }

        .tarjeta {
            background-color: rgba(255, 255, 255, 0.15); /* Tarjeta translúcida para mantener armonía */
            backdrop-filter: blur(8px);
            padding: 2.5rem;
            border-radius: 16px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.1);
            max-width: 480px;
            text-align: center;
            border: 1px solid rgba(255, 255, 255, 0.3);
        }

        .subtitulo {
            text-transform: uppercase;
            font-size: 0.85rem;
            letter-spacing: 1.5px;
            color: #fbcfe8; /* Rosa muy suave para contraste */
            font-weight: 600;
            margin-bottom: 0.5rem;
        }

        h1 {
            color: #ffffff; /* Nombre en blanco */
            font-weight: 600;
            font-size: 1.8rem;
            margin-top: 0;
            margin-bottom: 1rem;
        }

        p {
            color: #ffffff; /* Texto en blanco */
            line-height: 1.6;
            font-weight: 300;
        }
    </style>
</head>
<body>

    <div class="tarjeta">
        <p class="subtitulo">Página Personal</p>
        <h1>Andrea Mateos Perdigones</h1>
        <p>¡Bienvenido a mi sitio web! Este espacio está personalizado con mi nombre, un fondo rosa y letras en blanco.</p>
    </div>

</body>
</html>
