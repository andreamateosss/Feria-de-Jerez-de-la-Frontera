<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Página de Andrea Mateos Perdigones</title>
    
    <!-- Fuente 'Poppins' de Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
    
    <style>
        body {
            background-color: #e0f2fe; /* Fondo azul clarito */
            font-family: 'Poppins', system-ui, sans-serif; 
            color: #1e293b;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }

        .tarjeta {
            background-color: #ffffff;
            padding: 2.5rem;
            border-radius: 16px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.05);
            max-width: 480px;
            text-align: center;
        }

        .subtitulo {
            text-transform: uppercase;
            font-size: 0.85rem;
            letter-spacing: 1.5px;
            color: #0284c7;
            font-weight: 600;
            margin-bottom: 0.5rem;
        }

        h1 {
            color: #0f172a;
            font-weight: 600;
            font-size: 1.8rem;
            margin-top: 0;
            margin-bottom: 1rem;
        }

        p {
            color: #475569;
            line-height: 1.6;
            font-weight: 300;
        }
    </style>
</head>
<body>

    <div class="tarjeta">
        <p class="subtitulo">Página Personal</p>
        <h1>Andrea Mateos Perdigones</h1>
        <p>¡Bienvenido a mi sitio web! Este espacio está personalizado con mi nombre, un tono azul claro de fondo y una tipografía moderna.</p>
    </div>

</body>
</html>
